<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#fff8ef">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Моя Булочка"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <title>Моя Булочка</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding-bottom: 110px;
      background: #fff8ef;
      color: #3b2418;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    header {
      text-align: center;
      padding: 28px 16px 18px;
    }

    .logo {
      font-size: 52px;
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #8a6c5a;
      font-size: 14px;
    }

    .promo {
      margin: 8px 16px 20px;
      padding: 17px;
      border-radius: 20px;
      background: #fff0d9;
      border: 1px solid #f1d1a4;
    }

    .promo-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .promo-text {
      font-size: 14px;
      line-height: 1.5;
    }

    .section-title {
      margin: 18px 16px 12px;
      font-size: 22px;
      font-weight: 800;
    }

    #products {
      display: grid;
      gap: 12px;
      padding: 0 14px;
    }

    .product {
      background: white;
      border-radius: 20px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(70,40,20,.08);
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: #fff0dc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-size: 16px;
      font-weight: 750;
    }

    .price {
      margin-top: 5px;
      color: #bd6b2f;
      font-weight: 750;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .quantity button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 11px;
      background: #f0dfcd;
      color: #4b2c1a;
      font-size: 22px;
      font-weight: 700;
    }

    .number {
      min-width: 18px;
      text-align: center;
      font-weight: 700;
    }

    .cart-bar {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      background: #3b2418;
      color: white;
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
      z-index: 10;
    }

    .cart-count {
      font-size: 12px;
      opacity: .75;
    }

    .cart-total {
      margin-top: 2px;
      font-size: 18px;
      font-weight: 800;
    }

    .cart-button {
      border: none;
      border-radius: 13px;
      padding: 12px 15px;
      background: #f2a65a;
      color: #3b2418;
      font-weight: 800;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: flex-end;
      z-index: 100;
    }

    .overlay.show {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-height: 94vh;
      overflow-y: auto;
      background: #fff8ef;
      border-radius: 25px 25px 0 0;
      padding:
        20px
        16px
        calc(25px + env(safe-area-inset-bottom));
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sheet-title {
      font-size: 24px;
      font-weight: 800;
    }

    .close {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #efdfcf;
      font-size: 22px;
    }

    .cart-item {
      background: white;
      border-radius: 16px;
      padding: 12px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cart-item-name {
      font-weight: 750;
    }

    .cart-item-price {
      margin-top: 4px;
      font-size: 13px;
      color: #8a6c5a;
    }

    .promo-active {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #e5f6df;
      color: #2d6727;
      font-weight: 750;
      font-size: 14px;
    }

    .promo-inactive {
      margin-top: 14px;
      padding: 12px;
      border-radius: 14px;
      background: #eee6df;
      color: #765f50;
      font-size: 14px;
    }

    .summary {
      margin-top: 15px;
      padding: 16px;
      border-radius: 17px;
      background: #3b2418;
      color: white;
      display: flex;
      justify-content: space-between;
      font-size: 19px;
      font-weight: 800;
    }

    .form-title {
      margin-top: 22px;
      font-size: 20px;
      font-weight: 800;
    }

    label {
      display: block;
      margin-top: 13px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #dfcdbc;
      border-radius: 13px;
      padding: 12px;
      background: white;
      color: #3b2418;
      font: inherit;
      outline: none;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #d9823b;
    }

    .order-button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: #d9823b;
      color: white;
      font-size: 17px;
      font-weight: 800;
    }

    .order-button:disabled {
      opacity: .6;
    }

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #8a6c5a;
    }

    .success {
      text-align: center;
      padding: 25px 10px;
    }

    .success-icon {
      font-size: 60px;
    }

    .success h3 {
      font-size: 24px;
      margin: 10px 0;
    }

    .error-box {
      margin-top: 15px;
      padding: 14px;
      border-radius: 14px;
      background: #ffe4e0;
      color: #8b2e23;
      font-size: 14px;
    }

  </style>
</head>

<body>

<header>

  <div class="logo">
    🥐
  </div>

  <h1>
    Моя Булочка
  </h1>

  <div class="subtitle">
    Свежая выпечка каждый день
  </div>

</header>


<div class="promo">

  <div class="promo-title">
    🎁 Акция 09:00–11:00
  </div>

  <div class="promo-text">

    Купи любые
    <b>2 булочки</b>
    —
    получи
    <b>кофе бесплатно!</b>

    <br>

    После 11:00 акция автоматически прекращается.

  </div>

</div>


<div class="section-title">
  Наше меню
</div>


<div id="products"></div>


<div class="cart-bar">

  <div>

    <div
      class="cart-count"
      id="cartCount"
    >
      0 товаров
    </div>

    <div
      class="cart-total"
      id="cartTotal"
    >
      0 so'm
    </div>

  </div>


  <button
    class="cart-button"
    onclick="openCart()"
  >
    🛒 Корзина
  </button>

</div>


<div
  class="overlay"
  id="cartOverlay"
  onclick="closeByBackground(event)"
>

  <div class="sheet">

    <div class="sheet-header">

      <div class="sheet-title">
        🛒 Корзина
      </div>

      <button
        class="close"
        onclick="closeCart()"
      >
        ×
      </button>

    </div>


    <div id="cartItems"></div>

    <div id="promoStatus"></div>


    <div class="summary">

      <span>
        Итого
      </span>

      <span id="modalTotal">
        0 so'm
      </span>

    </div>


    <div id="orderForm">

      <div class="form-title">
        📦 Данные для заказа
      </div>


      <label for="customerName">
        Ваше имя
      </label>

      <input
        id="customerName"
        type="text"
        placeholder="Например: Muhammad"
      >


      <label for="customerPhone">
        Номер телефона
      </label>

      <input
        id="customerPhone"
        type="tel"
        placeholder="+998 90 123 45 67"
      >


      <label for="customerAddress">
        Адрес доставки
      </label>

      <input
        id="customerAddress"
        type="text"
        placeholder="Улица, дом, квартира"
      >


      <label for="customerComment">
        Комментарий
      </label>

      <textarea
        id="customerComment"
        placeholder="Например: позвонить перед доставкой"
      ></textarea>


      <button
        class="order-button"
        onclick="placeOrder()"
      >
        📦 Оформить заказ
      </button>

    </div>

  </div>

</div>


<script>

"use strict";


/* =================================
   ТОВАРЫ
================================= */

const products = [

  {
    id: 1,
    name: "Sosiskali bulochka",
    price: 7000,
    icon: "🌭",
    bun: true
  },

  {
    id: 2,
    name: "Vatrushka",
    price: 7000,
    icon: "🧀",
    bun: true
  },

  {
    id: 3,
    name: "Makli bulochka",
    price: 10000,
    icon: "🧈",
    bun: true
  },

  {
    id: 4,
    name: "Yong'oqli bulochka",
    price: 12000,
    icon: "🌰",
    bun: true
  },

  {
    id: 5,
    name: "Shokoladli bulochka",
    price: 15000,
    icon: "🍫",
    bun: true
  },

  {
    id: 6,
    name: "Jemli bulochka",
    price: 12000,
    icon: "🍓",
    bun: true
  },

  {
    id: 7,
    name: "Hotdog",
    price: 15000,
    icon: "🌭",
    bun: false
  },

  {
    id: 8,
    name: "Gamburger",
    price: 20000,
    icon: "🍔",
    bun: false
  },

  {
    id: 9,
    name: "Kofe",
    price: 10000,
    icon: "☕",
    bun: false,
    coffee: true
  },

  {
    id: 10,
    name: "Choy",
    price: 5000,
    icon: "🍵",
    bun: false
  }

];


const cart = {};


/* =================================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
================================= */

function money(value) {

  return Number(value)
    .toLocaleString("ru-RU")
    + " so'm";

}


function getQty(id) {

  return cart[id] || 0;

}


function getItems() {

  return Object.values(cart)
    .reduce(
      (sum, quantity) =>
        sum + quantity,
      0
    );

}


function getBunCount() {

  return products
    .filter(product => product.bun)
    .reduce(
      (sum, product) =>
        sum + getQty(product.id),
      0
    );

}


/* =================================
   АКЦИЯ
================================= */

function promoActive() {

  const now = new Date();

  const minutes =
    now.getHours() * 60 +
    now.getMinutes();

  return (
    minutes >= 540 &&
    minutes < 660
  );

}


function coffeeFree() {

  return (
    promoActive() &&
    getBunCount() >= 2 &&
    getQty(9) > 0
  );

}


/* =================================
   СУММА
================================= */

function getTotal() {

  let total = 0;


  products.forEach(product => {

    total +=
      product.price *
      getQty(product.id);

  });


  if (coffeeFree()) {

    total -=
      10000 *
      getQty(9);

  }


  return Math.max(total, 0);

}


/* =================================
   КОРЗИНА
================================= */

function add(id) {

  cart[id] =
    getQty(id) + 1;

  render();

}


function remove(id) {

  if (!getQty(id)) {
    return;
  }

  cart[id]--;

  if (cart[id] <= 0) {
    delete cart[id];
  }

  render();

}


/* =================================
   МЕНЮ
================================= */

function renderProducts() {

  const container =
    document.getElementById("products");


  container.innerHTML =
    products
      .map(product => {

        return `

          <div class="product">

            <div class="icon">
              ${product.icon}
            </div>

            <div class="info">

              <div class="name">
                ${product.name}
              </div>

              <div class="price">
                ${money(product.price)}
              </div>

            </div>

            <div class="quantity">

              <button
                onclick="remove(${product.id})"
              >
                −
              </button>

              <div class="number">
                ${getQty(product.id)}
              </div>

              <button
                onclick="add(${product.id})"
              >
                +
              </button>

            </div>

          </div>

        `;

      })
      .join("");

}


/* =================================
   НИЖНЯЯ ПАНЕЛЬ
================================= */

function renderBottomBar() {

  document
    .getElementById("cartCount")
    .textContent =
      getItems() + " товаров";


  document
    .getElementById("cartTotal")
    .textContent =
      money(getTotal());

}


/* =================================
   КОРЗИНА
================================= */

function renderCart() {

  const container =
    document.getElementById("cartItems");


  const selected =
    products.filter(
      product =>
        getQty(product.id) > 0
    );


  if (selected.length === 0) {

    container.innerHTML = `

      <div class="empty">

        🥐

        <br><br>

        Корзина пока пустая

      </div>

    `;

  } else {

    container.innerHTML =
      selected
        .map(product => {

          const quantity =
            getQty(product.id);


          let freeText = "";


          if (
            product.coffee &&
            coffeeFree()
          ) {

            freeText =
              `
              <br>
              <b>🎁 Бесплатно по акции</b>
              `;

          }


          return `

            <div class="cart-item">

              <div>

                <div class="cart-item-name">

                  ${product.icon}
                  ${product.name}

                </div>

                <div class="cart-item-price">

                  ${quantity}
                  ×
                  ${money(product.price)}

                  ${freeText}

                </div>

              </div>


              <div class="quantity">

                <button
                  onclick="remove(${product.id})"
                >
                  −
                </button>

                <div class="number">
                  ${quantity}
                </div>

                <button
                  onclick="add(${product.id})"
                >
                  +
                </button>

              </div>

            </div>

          `;

        })
        .join("");

  }


  document
    .getElementById("modalTotal")
    .textContent =
      money(getTotal());


  const status =
    document.getElementById("promoStatus");


  if (coffeeFree()) {

    status.innerHTML = `

      <div class="promo-active">

        🎁 Акция активна!
        Кофе бесплатно.

      </div>

    `;

  } else if (promoActive()) {

    status.innerHTML = `

      <div class="promo-active">

        ☕ Акция действует до 11:00.

        Купите минимум
        2 булочки —
        кофе будет бесплатным.

      </div>

    `;

  } else {

    status.innerHTML = `

      <div class="promo-inactive">

        ⏰ Сейчас акция не действует.

        Бесплатный кофе доступен
        только с 09:00 до 11:00.

      </div>

    `;

  }

}


/* =================================
   ПОЛНАЯ ОТРИСОВКА
================================= */

function render() {

  renderProducts();

  renderBottomBar();

  renderCart();

}


/* =================================
   ОТКРЫТЬ КОРЗИНУ
================================= */

function openCart() {

  document
    .getElementById("cartOverlay")
    .classList.add("show");

  renderCart();

}


/* =================================
   ЗАКРЫТЬ КОРЗИНУ
================================= */

function closeCart() {

  document
    .getElementById("cartOverlay")
    .classList.remove("show");

}


function closeByBackground(event) {

  if (
    event.target.id ===
    "cartOverlay"
  ) {

    closeCart();

  }

}


/* =================================
   ОФОРМЛЕНИЕ ЗАКАЗА
================================= */

async function placeOrder() {

  if (getItems() === 0) {

    alert(
      "Добавьте товары в корзину."
    );

    return;

  }


  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const address =
    document
      .getElementById("customerAddress")
      .value
      .trim();


  const comment =
    document
      .getElementById("customerComment")
      .value
      .trim();


  if (!name) {

    alert("Введите ваше имя.");

    return;

  }


  if (!phone) {

    alert("Введите номер телефона.");

    return;

  }


  if (!address) {

    alert("Введите адрес доставки.");

    return;

  }


  const items =
    products
      .filter(
        product =>
          getQty(product.id) > 0
      )
      .map(product => ({

        id: product.id,

        name: product.name,

        quantity:
          getQty(product.id),

        price:
          product.price

      }));


  const orderData = {

    name,

    phone,

    address,

    comment,

    items,

    total:
      getTotal(),

    promo:
      coffeeFree()

  };


  const button =
    document.querySelector(
      ".order-button"
    );


  button.disabled = true;

  button.textContent =
    "⏳ Отправляем заказ...";


  try {

    const response =
      await fetch(
        "/api/order",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(orderData)
        }
      );


    let data = {};

    try {

      data =
        await response.json();

    } catch {

      data = {};

    }


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Не удалось отправить заказ"
      );

    }


    const finalTotal =
      getTotal();


    document
      .getElementById("orderForm")
      .innerHTML = `

        <div class="success">

          <div class="success-icon">
            ✅
          </div>

          <h3>
            Заказ отправлен!
          </h3>

          <p>
            Спасибо, ${name}!
          </p>

          <p>
            Мы получили ваш заказ.
          </p>

          <p>
            💰 Сумма:
            <b>
              ${money(finalTotal)}
            </b>
          </p>

        </div>

      `;


    Object.keys(cart)
      .forEach(id => {

        delete cart[id];

      });


    render();

  } catch (error) {

    console.error(
      "ORDER ERROR:",
      error
    );


    alert(
      "Не удалось отправить заказ.\n\n" +
      "Попробуйте ещё раз."
    );


    button.disabled = false;

    button.textContent =
      "📦 Оформить заказ";

  }

}


/* =================================
   ЗАПУСК
================================= */

render();


/*
  Проверяем акцию каждую минуту.
  В 11:00 бесплатный кофе
  автоматически перестанет действовать.
*/

setInterval(
  function() {

    render();

  },
  60000
);

</script>

</body>
</html>
