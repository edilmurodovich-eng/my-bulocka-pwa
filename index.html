<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#fff8ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Моя Булочка">

  <link rel="manifest" href="manifest.webmanifest">

  <title>Моя Булочка</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #fff8ef;
      color: #3b2418;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: 110px;
    }

    header {
      text-align: center;
      padding: 28px 18px 18px;
    }

    .logo {
      font-size: 52px;
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #8a6c5a;
      font-size: 14px;
    }

    .promo {
      margin: 8px 16px 20px;
      padding: 17px;
      border-radius: 20px;
      background: #fff0d9;
      border: 1px solid #f1d1a4;
    }

    .promo-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .promo-text {
      font-size: 14px;
      line-height: 1.45;
    }

    .section-title {
      margin: 18px 16px 12px;
      font-size: 22px;
      font-weight: 800;
    }

    .products {
      display: grid;
      gap: 12px;
      padding: 0 14px;
    }

    .product {
      background: white;
      border-radius: 20px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(70, 40, 20, 0.08);
    }

    .icon {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: #fff0dc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .name {
      font-size: 16px;
      font-weight: 750;
    }

    .price {
      margin-top: 5px;
      color: #bd6b2f;
      font-weight: 750;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .quantity button {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 11px;
      background: #f0dfcd;
      color: #4b2c1a;
      font-size: 22px;
      font-weight: 700;
    }

    .number {
      min-width: 18px;
      text-align: center;
      font-weight: 700;
    }

    .cart-bar {
      position: fixed;
      left: 14px;
      right: 14px;
      bottom: 14px;
      background: #3b2418;
      color: white;
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 28px rgba(0,0,0,.22);
      z-index: 10;
    }

    .cart-count {
      font-size: 12px;
      opacity: .75;
    }

    .cart-total {
      margin-top: 2px;
      font-size: 18px;
      font-weight: 800;
    }

    .cart-button {
      border: none;
      border-radius: 13px;
      padding: 12px 15px;
      background: #f2a65a;
      color: #3b2418;
      font-weight: 800;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🥐</div>
  <h1>Моя Булочка</h1>
  <div class="subtitle">
    Свежая выпечка каждый день
  </div>
</header>

<div class="promo">
  <div class="promo-title">
    🎁 Акция 09:00–11:00
  </div>

  <div class="promo-text">
    Купи любые <b>2 булочки</b> — получи
    <b>кофе бесплатно!</b>
    <br>
    После 11:00 акция автоматически прекращается.
  </div>
</div>

<div class="section-title">
  Наше меню
</div>

<div class="products" id="products"></div>

<div class="cart-bar">

  <div>
    <div class="cart-count" id="cartCount">
      0 товаров
    </div>

    <div class="cart-total" id="cartTotal">
      0 so'm
    </div>
  </div>

  <button class="cart-button" onclick="openCart()">
    🛒 Корзина
  </button>

</div>

<script>

const products = [

  {
    id: 1,
    name: "Sosiskali bulochka",
    price: 7000,
    icon: "🌭",
    bun: true
  },

  {
    id: 2,
    name: "Vatrushka",
    price: 7000,
    icon: "🧀",
    bun: true
  },

  {
    id: 3,
    name: "Makli bulochka",
    price: 10000,
    icon: "🧈",
    bun: true
  },

  {
    id: 4,
    name: "Yong'oqli bulochka",
    price: 12000,
    icon: "🌰",
    bun: true
  },

  {
    id: 5,
    name: "Shokoladli bulochka",
    price: 15000,
    icon: "🍫",
    bun: true
  },

  {
    id: 6,
    name: "Jemli bulochka",
    price: 12000,
    icon: "🍓",
    bun: true
  },

  {
    id: 7,
    name: "Hotdog",
    price: 15000,
    icon: "🌭",
    bun: false
  },

  {
    id: 8,
    name: "Gamburger",
    price: 20000,
    icon: "🍔",
    bun: false
  },

  {
    id: 9,
    name: "Kofe",
    price: 10000,
    icon: "☕",
    bun: false,
    coffee: true
  },

  {
    id: 10,
    name: "Choy",
    price: 5000,
    icon: "🍵",
    bun: false
  }

];

const cart = {};

function formatPrice(price) {
  return price.toLocaleString("ru-RU") + " so'm";
}

function getQuantity(id) {
  return cart[id] || 0;
}

function addToCart(id) {

  cart[id] = getQuantity(id) + 1;

  render();

}

function removeFromCart(id) {

  if (!cart[id]) return;

  cart[id]--;

  if (cart[id] <= 0) {
    delete cart[id];
  }

  render();

}

function getBunCount() {

  return products
    .filter(product => product.bun)
    .reduce(
      (sum, product) =>
        sum + getQuantity(product.id),
      0
    );

}

function isPromoActive() {

  const now = new Date();

  const minutes =
    now.getHours() * 60 +
    now.getMinutes();

  return minutes >= 540 && minutes < 660;

}

function isCoffeeFree() {

  return (
    isPromoActive() &&
    getBunCount() >= 2
  );

}

function getTotal() {

  let total = 0;

  products.forEach(product => {

    total +=
      product.price *
      getQuantity(product.id);

  });

  if (isCoffeeFree()) {

    total -=
      10000 *
      getQuantity(9);

  }

  return Math.max(total, 0);

}

function getTotalItems() {

  return Object.values(cart)
    .reduce((sum, quantity) => sum + quantity, 0);

}

function render() {

  const container =
    document.getElementById("products");

  container.innerHTML =
    products.map(product => {

      const quantity =
        getQuantity(product.id);

      return `

        <div class="product">

          <div class="icon">
            ${product.icon}
          </div>

          <div class="info">

            <div class="name">
              ${product.name}
            </div>

            <div class="price">
              ${formatPrice(product.price)}
            </div>

          </div>

          <div class="quantity">

            <button
              onclick="removeFromCart(${product.id})">
              −
            </button>

            <div class="number">
              ${quantity}
            </div>

            <button
              onclick="addToCart(${product.id})">
              +
            </button>

          </div>

        </div>

      `;

    }).join("");

  document.getElementById("cartCount")
    .textContent =
      getTotalItems() + " товаров";

  document.getElementById("cartTotal")
    .textContent =
      formatPrice(getTotal());

}

function openCart() {

  if (getTotalItems() === 0) {

    alert("Корзина пока пустая 🥐");

    return;

  }

  let message =
    "🛒 Ваша корзина:\n\n";

  products.forEach(product => {

    const quantity =
      getQuantity(product.id);

    if (quantity > 0) {

      message +=
        `${product.name} — ${quantity} шт.\n`;

    }

  });

  if (isCoffeeFree()) {

    message +=
      "\n🎁 Кофе бесплатно по акции!";

  }

  message +=
    "\n\n💰 Итого: " +
    formatPrice(getTotal());

  alert(message);

}

render();

</script>

</body>
</html>
